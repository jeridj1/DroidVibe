name: Temporary Full Repository Backup

on:
  push:
    branches:
      - main

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create full Git mirror
        shell: bash
        run: |
          set -euo pipefail
          git clone --mirror "https://github.com/${GITHUB_REPOSITORY}.git" DroidVibe.git
          git -C DroidVibe.git fsck --full
          tar -czf DroidVibe-full-git-backup.tar.gz DroidVibe.git
          unzip -h >/dev/null 2>&1 || true
      - name: Upload full Git mirror
        uses: actions/upload-artifact@v4
        with:
          name: DroidVibe-full-git-backup
          path: DroidVibe-full-git-backup.tar.gz
          retention-days: 90
