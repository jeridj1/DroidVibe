name: Merge Critical Fixes

on:
  workflow_dispatch:

jobs:
  merge-fixes:
    name: Merge Critical Fixes into main
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Merge fix/initial-route-unmatched
        uses: actions/github-script@v6
        with:
          script: |
            try {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Merge fix/initial-route-unmatched into main',
                head: 'fix/initial-route-unmatched',
                base: 'main',
                body: 'Merging routing fix into main to resolve "Unmatched Route" errors.'
              });
              console.log(`Created PR #${pr.number} for fix/initial-route-unmatched`);
              
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });
              console.log('Merged fix/initial-route-unmatched into main');
            } catch (e) {
              console.log('Error merging fix/initial-route-unmatched:', e.message);
            }

      - name: Merge fix/editor-layout-and-settings
        uses: actions/github-script@v6
        with:
          script: |
            try {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Merge fix/editor-layout-and-settings into main',
                head: 'fix/editor-layout-and-settings',
                base: 'main',
                body: 'Merging editor UI fixes into main.'
              });
              console.log(`Created PR #${pr.number} for fix/editor-layout-and-settings`);
              
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });
              console.log('Merged fix/editor-layout-and-settings into main');
            } catch (e) {
              console.log('Error merging fix/editor-layout-and-settings:', e.message);
            }

      - name: Merge fix/usb-retry-and-standalone-ai
        uses: actions/github-script@v6
        with:
          script: |
            try {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Merge fix/usb-retry-and-standalone-ai into main',
                head: 'fix/usb-retry-and-standalone-ai',
                base: 'main',
                body: 'Merging USB auto-retry and standalone AI fixes into main.'
              });
              console.log(`Created PR #${pr.number} for fix/usb-retry-and-standalone-ai`);
              
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });
              console.log('Merged fix/usb-retry-and-standalone-ai into main');
            } catch (e) {
              console.log('Error merging fix/usb-retry-and-standalone-ai:', e.message);
            }

      - name: Merge fix/droidvibe-production-usb
        uses: actions/github-script@v6
        with:
          script: |
            try {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Merge fix/droidvibe-production-usb into main',
                head: 'fix/droidvibe-production-usb',
                base: 'main',
                body: 'Merging RP2040 UF2 fixes into main.'
              });
              console.log(`Created PR #${pr.number} for fix/droidvibe-production-usb`);
              
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });
              console.log('Merged fix/droidvibe-production-usb into main');
            } catch (e) {
              console.log('Error merging fix/droidvibe-production-usb:', e.message);
            }
