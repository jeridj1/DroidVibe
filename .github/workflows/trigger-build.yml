name: Trigger Debug APK Build

on:
  workflow_dispatch:

jobs:
  trigger-build:
    name: Trigger Debug APK Build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger build-apk workflow
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-apk.yml',
              ref: 'main',
            });
            console.log('Triggered build-apk workflow');
