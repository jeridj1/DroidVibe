name: One-shot native USB Kotlin repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[one-shot-native-usb-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact Record declaration repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/native-usb/android/src/main/java/com/droidvibe/nativeusb/DroidVibeUsbModule.kt')
          s = p.read_text()
          old = ': Record()'
          new = ': Record'
          if s.count(old) != 6:
              raise SystemExit(f'Expected exactly six Record() declarations, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Verify exact change
        run: |
          test "$(grep -c ': Record {' 'packages/native-usb/android/src/main/java/com/droidvibe/nativeusb/DroidVibeUsbModule.kt')" -eq 6
          test "$(grep -c ': Record()' 'packages/native-usb/android/src/main/java/com/droidvibe/nativeusb/DroidVibeUsbModule.kt' || true)" -eq 0
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'packages/native-usb/android/src/main/java/com/droidvibe/nativeusb/DroidVibeUsbModule.kt'
          git commit -m 'fix: correct Expo Kotlin Record declarations'
          git push
