name: One-shot bench repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[one-shot-bench-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact one-line repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/mobile/app/(tabs)/bench.tsx')
          s = p.read_text()
          old = '<WaveformViewer mode="plot" palette={palette} dataSource={connectedDevice ? \'serial\' : \'demo\'} />'
          new = '<WaveformViewer mode="plotter" palette={palette} dataSource={connectedDevice ? \'serial\' : \'demo\'} />'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one target line, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Verify exact change
        run: |
          grep -F 'WaveformViewer mode="plotter"' 'apps/mobile/app/(tabs)/bench.tsx'
          ! grep -F 'WaveformViewer mode="plot"' 'apps/mobile/app/(tabs)/bench.tsx'
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/mobile/app/(tabs)/bench.tsx'
          git commit -m 'fix: correct bench plotter mode'
          git push
