name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  quality:
    name: Typecheck and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          pnpm typecheck > /tmp/tsc-output.txt 2>&1
          tsc_exit=$?
          cat /tmp/tsc-output.txt
          if [ $tsc_exit -ne 0 ]; then
            echo "## Full Typecheck Output" >> $GITHUB_STEP_SUMMARY
            echo '~~~' >> $GITHUB_STEP_SUMMARY
            cat /tmp/tsc-output.txt >> $GITHUB_STEP_SUMMARY
            echo '~~~' >> $GITHUB_STEP_SUMMARY
            {
              echo "## Full Typecheck Output"
              echo ""
              echo "Commit: ${{ github.sha }}"
              echo ""
              echo '~~~'
              cat /tmp/tsc-output.txt
              echo '~~~'
            } > /tmp/tc-issue.md
            gh issue create --title "CI: Typecheck failure (${{ github.sha }})" --body-file /tmp/tc-issue.md || true
            exit 1
          fi
      - name: Upload typecheck output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-output
          path: /tmp/tsc-output.txt
          if-no-files-found: ignore
      - run: pnpm lint

  web-build:
    name: Build Web Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @droidvibe/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test

  mobile-prebuild:
    name: Expo Prebuild Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Generate PNG assets from SVG sources
        run: |
          npm install --prefix /tmp/asset-tools sharp
          NODE_PATH=/tmp/asset-tools/node_modules node scripts/generate-assets.js
      - name: Expo prebuild
        working-directory: apps/mobile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          pnpm exec expo prebuild --platform android --no-install --clean > /tmp/prebuild-output.txt 2>&1
          prebuild_exit=$?
          cat /tmp/prebuild-output.txt
          if [ $prebuild_exit -ne 0 ]; then
            {
              echo "## Expo Prebuild Failure"
              echo ""
              echo "Commit: ${{ github.sha }}"
              echo ""
              echo '~~~'
              cat /tmp/prebuild-output.txt
              echo '~~~'
            } > /tmp/pb-issue.md
            gh issue create --title "CI: Expo prebuild failure (${{ github.sha }})" --body-file /tmp/pb-issue.md || true
            exit 1
          fi

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: mobile-prebuild
    env:
      EXPO_NO_TELEMETRY: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Xmx3g"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
          key: gradle-debug-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-debug-${{ runner.os }}-
      - run: pnpm install --no-frozen-lockfile
      - name: Generate PNG assets from SVG sources
        run: |
          npm install --prefix /tmp/asset-tools sharp
          NODE_PATH=/tmp/asset-tools/node_modules node scripts/generate-assets.js
      - name: Expo prebuild
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Accept SDK licenses & install components
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 2>&1 || true
      - name: Patch build config
        working-directory: apps/mobile/android
        run: |
          if [ -f gradle.properties ]; then
            if grep -q 'android.kotlinVersion=' gradle.properties; then
              sed -i 's/android.kotlinVersion=.*/android.kotlinVersion=1.9.25/' gradle.properties
            else
              echo "android.kotlinVersion=1.9.25" >> gradle.properties
            fi
          else
            echo "android.kotlinVersion=1.9.25" > gradle.properties
          fi
          if ! grep -q 'kotlin.jvm.target.validation.mode' gradle.properties; then
            echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          fi
          if ! grep -q 'org.gradle.jvmargs' gradle.properties; then
            echo "org.gradle.jvmargs=-Xmx3g" >> gradle.properties
          fi
          if ! grep -q 'org.gradle.parallel' gradle.properties; then
            echo "org.gradle.parallel=true" >> gradle.properties
          fi
          if ! grep -q 'org.gradle.caching' gradle.properties; then
            echo "org.gradle.caching=true" >> gradle.properties
          fi
          if [ -f build.gradle ]; then
            sed -i 's/ndkVersion = .*/ndkVersion = "27.3.13750724"/' build.gradle
          fi
          if [ -f app/build.gradle ]; then
            if ! grep -q 'buildConfig = true' app/build.gradle; then
              if grep -q 'buildConfig = false' app/build.gradle; then
                sed -i 's/buildConfig = false/buildConfig = true/g' app/build.gradle
              elif grep -q 'buildFeatures {' app/build.gradle; then
                sed -i '/buildFeatures {/a\        buildConfig = true' app/build.gradle
              elif grep -q 'android {' app/build.gradle; then
                sed -i '/android {/a\    buildFeatures {\n        buildConfig = true\n    }' app/build.gradle
              fi
            fi
            if ! grep -q 'namespace "com.droidvibe.app"' app/build.gradle; then
              if grep -q 'namespace "' app/build.gradle; then
                sed -i 's/namespace "[^"]*"/namespace "com.droidvibe.app"/' app/build.gradle
              elif grep -q 'android {' app/build.gradle; then
                sed -i '/android {/a\    namespace "com.droidvibe.app"' app/build.gradle
              fi
            fi
          fi
          echo "=== Final gradle.properties ==="
          cat gradle.properties
      - name: Configure release build
        working-directory: apps/mobile/android
        run: |
          # Ensure release build type uses debug signing config (auto-generated by Gradle)
          # and disable minification for test builds
          if [ -f app/build.gradle ]; then
            # Add signingConfig to release block if not present
            if ! grep -A20 'release {' app/build.gradle | grep -q 'signingConfig'; then
              sed -i '/release {/a\            signingConfig signingConfigs.debug' app/build.gradle
            fi
            # Disable minification
            sed -i 's/minifyEnabled true/minifyEnabled false/g' app/build.gradle
            if grep -q 'enableProguardInReleaseBuilds' app/build.gradle; then
              sed -i 's/enableProguardInReleaseBuilds = true/enableProguardInReleaseBuilds = false/g' app/build.gradle
            fi
          fi
          echo "=== Release build config ==="
          grep -A15 'buildTypes' app/build.gradle || echo "No buildTypes found"
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --parallel --build-cache
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: droidvibe-android-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      - name: Report build error
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Android APK Build Failure"
            echo ""
            echo "Commit: ${{ github.sha }}"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/apk-issue.md
          gh issue create --title "CI: Android APK build failure (${{ github.sha }})" --body-file /tmp/apk-issue.md || true
