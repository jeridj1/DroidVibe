name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint

  build-firmware:
    name: Build RP2040 Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake
      - name: Clone Pico SDK
        run: git clone --depth 1 --recurse-submodules https://github.com/raspberrypi/pico-sdk.git /tmp/pico-sdk
      - name: Build firmware projects
        env:
          PICO_SDK_PATH: /tmp/pico-sdk
        run: |
          set -e
          mkdir -p firmware-out
          for project in logic_analyzer swd jtag avr_isp; do
            echo "=== Building firmware/$project ==="
            mkdir -p "firmware/$project/build"
            (cd "firmware/$project/build" && cmake .. -DPICO_SDK_PATH="$PICO_SDK_PATH" && make -j$(nproc) 2>&1)
            for uf2_file in "firmware/$project/build"/*.uf2; do
              [ -f "$uf2_file" ] && cp "$uf2_file" firmware-out/
            done
          done
          echo "=== All firmware built ==="
          ls -la firmware-out/ || true
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-uf2
          path: firmware-out/*.uf2
          if-no-files-found: error
          retention-days: 30

  mobile-prebuild:
    name: Expo Prebuild Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate PNG assets from SVG sources
        run: |
          npm install --prefix /tmp/asset-tools sharp
          NODE_PATH=/tmp/asset-tools/node_modules node scripts/generate-assets.js
      - name: Expo prebuild
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean