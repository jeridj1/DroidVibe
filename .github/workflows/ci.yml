name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck + Lint (capture)
        run: |
          set +e
          pnpm typecheck > typecheck.log 2>&1; tc=$?
          pnpm lint > lint.log 2>&1; lc=$?
          {
            echo "## Typecheck (exit ${tc})"
            echo '```'
            cat typecheck.log
            echo '```'
            echo "## Lint (exit ${lc})"
            echo '```'
            cat lint.log
            echo '```'
          } > combined.log
          [ "${tc}" -eq 0 ] && [ "${lc}" -eq 0 ]
      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f combined.log ]; then
            gh issue create --title "CI: Typecheck/Lint failure (${GITHUB_SHA::7})" --body-file combined.log || echo "gh create failed"
          else
            gh issue create --title "CI: failure before checks (${GITHUB_SHA::7})" --body "A CI step failed before checks completed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || echo "gh create failed"
          fi

  web-build:
    name: Build Web Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - name: Build web (capture)
        run: |
          set +e
          pnpm --filter @droidvibe/web build > build.log 2>&1; b=$?
          { echo '## Web build (exit '${b}')'; echo '```'; cat build.log; echo '```'; } > combined.log
          [ "${b}" -eq 0 ]
      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f combined.log ]; then
            gh issue create --title "CI: Web build failure (${GITHUB_SHA::7})" --body-file combined.log || echo "gh create failed"
          else
            gh issue create --title "CI: Web build failure (${GITHUB_SHA::7})" --body "Step failed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || echo "gh create failed"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-dist
          path: packages/web/dist

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - name: Tests (capture)
        run: |
          set +e
          pnpm test > test.log 2>&1; t=$?
          { echo '## Tests (exit '${t}')'; echo '```'; cat test.log; echo '```'; } > combined.log
          [ "${t}" -eq 0 ]
      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f combined.log ]; then
            gh issue create --title "CI: Test failure (${GITHUB_SHA::7})" --body-file combined.log || echo "gh create failed"
          else
            gh issue create --title "CI: Test failure (${GITHUB_SHA::7})" --body "Step failed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || echo "gh create failed"
          fi

  mobile-prebuild:
    name: Expo Prebuild Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - name: Expo prebuild (Android, capture)
        working-directory: apps/mobile
        run: |
          set +e
          pnpm exec expo prebuild --platform android --no-install --clean > prebuild.log 2>&1; p=$?
          { echo '## Expo prebuild (exit '${p}')'; echo '```'; cat prebuild.log; echo '```'; } > combined.log
          [ "${p}" -eq 0 ]
      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f combined.log ]; then
            gh issue create --title "CI: Expo prebuild failure (${GITHUB_SHA::7})" --body-file combined.log || echo "gh create failed"
          else
            gh issue create --title "CI: Expo prebuild failure (${GITHUB_SHA::7})" --body "Step failed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || echo "gh create failed"
          fi
