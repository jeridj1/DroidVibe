name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  quality:
    name: Typecheck and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          pnpm typecheck > /tmp/tsc-output.txt 2>&1
          tsc_exit=$?
          cat /tmp/tsc-output.txt
          if [ $tsc_exit -ne 0 ]; then
            echo "## Full Typecheck Output" >> $GITHUB_STEP_SUMMARY
            echo '~~~' >> $GITHUB_STEP_SUMMARY
            cat /tmp/tsc-output.txt >> $GITHUB_STEP_SUMMARY
            echo '~~~' >> $GITHUB_STEP_SUMMARY
            {
              echo "## Full Typecheck Output"
              echo ""
              echo "Commit: ${{ github.sha }}"
              echo ""
              echo '~~~'
              cat /tmp/tsc-output.txt
              echo '~~~'
            } > /tmp/tc-issue.md
            gh issue create --title "CI: Typecheck failure (${{ github.sha }})" --body-file /tmp/tc-issue.md || true
            exit 1
          fi
      - name: Upload typecheck output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-output
          path: /tmp/tsc-output.txt
          if-no-files-found: ignore
      - run: pnpm lint

  web-build:
    name: Build Web Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @droidvibe/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test

  mobile-prebuild:
    name: Expo Prebuild Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Expo prebuild
        working-directory: apps/mobile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          pnpm exec expo prebuild --platform android --no-install --clean > /tmp/prebuild-output.txt 2>&1
          prebuild_exit=$?
          cat /tmp/prebuild-output.txt
          if [ $prebuild_exit -ne 0 ]; then
            {
              echo "## Expo Prebuild Failure"
              echo ""
              echo "Commit: ${{ github.sha }}"
              echo ""
              echo '~~~'
              cat /tmp/prebuild-output.txt
              echo '~~~'
            } > /tmp/pb-issue.md
            gh issue create --title "CI: Expo prebuild failure (${{ github.sha }})" --body-file /tmp/pb-issue.md || true
            exit 1
          fi
