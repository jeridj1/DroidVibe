name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  quality:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck 2>&1 | tee typecheck.log
      - run: pnpm lint 2>&1 | tee lint.log
      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '## Typecheck / Lint output'
            echo '```'
            cat typecheck.log lint.log 2>/dev/null | tail -150
            echo '```'
            echo ""
            echo "Commit: ${{ github.sha }}"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/issue-body.md
          gh issue create --title "CI: Typecheck/Lint failure (${{ github.sha }})" --body-file /tmp/issue-body.md || true

  web-build:
    name: Build Web Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @droidvibe/web build 2>&1 | tee web-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist
      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '```'; tail -80 web-build.log 2>/dev/null; echo '```'; echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > /tmp/issue-body.md
          gh issue create --title "CI: Web build failure (${{ github.sha }})" --body-file /tmp/issue-body.md || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test 2>&1 | tee test.log
      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '```'; tail -150 test.log 2>/dev/null; echo '```'; echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > /tmp/issue-body.md
          gh issue create --title "CI: Test failure (${{ github.sha }})" --body-file /tmp/issue-body.md || true

  mobile-prebuild:
    name: Expo Prebuild Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - name: Expo prebuild (Android)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean 2>&1 | tee prebuild.log
      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '```'; tail -80 prebuild.log 2>/dev/null; echo '```'; echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > /tmp/issue-body.md
          gh issue create --title "CI: Prebuild failure (${{ github.sha }})" --body-file /tmp/issue-body.md || true

  apk-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [quality, mobile-prebuild]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --no-frozen-lockfile
      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
      - name: Install Android SDK components
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'platform-tools' \
            'ndk;27.0.12077973' \
            'cmake;3.22.1' 2>/dev/null || true
      - name: Expo prebuild (Android)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Build debug APK
        working-directory: apps/mobile/android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: droidvibe-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: apps/mobile/android/gradle-build.log
          retention-days: 30
      - name: Report gradle failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'Gradle `assembleDebug` failed.'
            echo ''
            echo '## Kotlin compilation errors'
            echo '```'
            grep -E '^e: |error:|Unresolved reference|cannot find|FAILURE|What went wrong' apps/mobile/android/gradle-build.log 2>/dev/null | head -80 || echo "no errors found in grep"
            echo '```'
            echo ''
            echo '## Last 200 lines of build log'
            echo '```'
            tail -200 apps/mobile/android/gradle-build.log 2>/dev/null || echo "no gradle-build.log found"
            echo '```'
            echo ""
            echo "Commit: ${{ github.sha }}"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/issue-body.md
          gh issue create --title "CI: APK build failure (${{ github.sha }})" --body-file /tmp/issue-body.md || true
