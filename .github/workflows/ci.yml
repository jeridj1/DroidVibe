name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_NO_TELEMETRY: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Xmx3g"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify app.config.js syntax
        run: node --check apps/mobile/app.config.js

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run lint
        run: pnpm lint

      - name: Generate PNG assets from SVG sources
        run: |
          npm install --prefix /tmp/asset-tools sharp
          NODE_PATH=/tmp/asset-tools/node_modules node scripts/generate-assets.js

      - name: Expo prebuild
        working-directory: apps/mobile
        run: |
          pnpm exec expo prebuild --platform android --no-install --clean

      - name: Run post-prebuild configuration
        working-directory: apps/mobile
        run: chmod +x post-prebuild.sh && ./post-prebuild.sh

      - name: Accept SDK licenses and install components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools' 'cmake;3.22.1' 2>&1 || true

      - name: Verify gradle.properties
        working-directory: apps/mobile/android
        run: |
          echo "=== gradle.properties ==="
          cat gradle.properties
          e
cho ""
          echo "=== Checking Kotlin version ==="
          grep "android.kotlinVersion" gradle.properties || echo "WARNING: Kotlin version not set"
          echo "=== Checking JVM validation mode ==="
          grep "kotlin.jvm.target.validation.mode" gradle.properties || echo "WARNING: JVM validation mode not set"

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --parallel --build-cache --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: droidvibe-android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
