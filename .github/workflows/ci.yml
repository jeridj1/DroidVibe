name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_NO_TELEMETRY: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Xmx3g"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate PNG assets from SVG sources
        run: |
          npm install --prefix /tmp/asset-tools sharp
          NODE_PATH=/tmp/asset-tools/node_modules node scripts/generate-assets.js

      - name: Expo prebuild
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Accept SDK licenses and install components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools' 'cmake;3.22.1' 2>&1 || true

      - name: Patch build config
        working-directory: apps/mobile/android
        run: |
          if [ -f gradle.properties ]; then
            if ! grep -q 'android.kotlinVersion=' gradle.properties; then
              echo "android.kotlinVersion=1.9.25" >> gradle.properties
            fi
            if ! grep -q 'kotlin.jvm.target.validation.mode' gradle.properties; then
              echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
            fi
            if ! grep -q 'org.gradle.jvmargs' gradle.properties; then
              echo "org.gradle.jvmargs=-Xmx3g" >> gradle.properties
            fi
            if ! grep -q 'org.gradle.parallel' gradle.properties; then
              echo "org.gradle.parallel=true" >> gradle.properties
            fi
            if ! grep -q 'org.gradle.caching' gradle.properties; then
              echo "org.gradle.caching=true" >> gradle.properties
            fi
          else
            cat > gradle.properties << EOF
android.kotlinVersion=1.9.25
kotlin.jvm.target.validation.mode=warning
org.gradle.jvmargs=-Xmx3g
org.gradle.parallel=true
org.gradle.caching=true
EOF
          fi

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --parallel --build-cache --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: droidvibe-android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
