name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  quality:
    name: Typecheck and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          pnpm typecheck 2>&1 | tee /tmp/tsc-output.txt
          tsc_exit=${PIPESTATUS[0]}
          if [ $tsc_exit -ne 0 ]; then
            echo "## Full Typecheck Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/tsc-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            {
              echo "## Full Typecheck Output"
              echo ""
              echo "Commit: ${{ github.sha }}"
              echo ""
              echo '```'
              cat /tmp/tsc-ouput.txt
              echo '```'
            } > /tmp/tc-issue.md
            gh issue create --title "CI: Typecheck failure (${{ github.sha }})" --body-file /tmp/tc-issue.md || true
            exit 1
          fi
      - name: Upload typecheck output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-output
          path: /tmp/tsc-output.txt
          if-no-files-found: ignore
      - run: pnpm lint

  web-build:
    name: Build Web Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Build web
        run: pnpm --filter @droidvibe/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test

  mobile-prebuild:
    name: Expo Prebuild Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Expo prebuild
        working-directory: apps/mobile
        run: |
          pnpm exec expo prebuild -platform android --no-install --clean 2>&1 | tee prebuild.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prebuild-log
          path: apps/mobile/prebuild.log
      - name: Report error
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Prebuild failed" > /tmp/issue.md
          echo "See prebuild-log artifact" >> /tmp/issue.md
          tail -80 apps/mobile/prebuild.log >> /tmp/issue.md
          gh issue create --title "CI: Prebuild failed" --body-file /tmp/issue.md || true

  apk-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [quality, mobile-prebuild]
    env:
      EXPO_NO_TELEMETRY: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Xmx3g"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: pnpm install --no-frozen-lockfile
      - name: SDK licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
      - name: Install SDK components
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools35.0.0' 'platform-tools' 'cmake;3.22.1' 2>&1 || true
      - name: Expo prebuild
        working-directory: apps/mobile
        run: |
          pnpm exec expo prebuild -platform android --no-install --clean 2>&1 | tee prebuild-apk.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prebuild-apk-log
          path: apps/mobile/prebuild-apk.log
      - name: Debug prebuild output
        working-directory: apps/mobile
        if: always()
        run: |
          echo "=== Checking if config plugins ran ==="
          echo "--- prebuild-apk.log (plugin-related lines) ---"
          grep -i "plugin\|config|buildConfig|withApp\|withGradle||error\|warn" prebuild-ppk.log | head -30 || echo "No matching lines found"
          echo "--- gradle.properties (checking for -Xmx3g from plugin) ---"
          grep 'org.gradle.jvmargs' android/gradle.properties 2>/dev/null || echo "gradle.properties not found"
          echo "--- app/build.gradle (buildConfig) ---"
          grep 'buildConfig' android/app/build.gradle 2>/dev/null || echo "buildConfig not found in app/build.gradle"
          echo "--- app/build.gradle (namespace) ---"
          grep 'namespace' android/app/build.gradle 2>/dev/null || echo "namespace not found in app/build.gradle"
      - name: Patch build config
        working-directory: apps/mobile/android
        if: success()
        run: |
          echo "=== Patching gradle.properties ==="
          if [ -f gradle.properties ]; then
            if grep -q 'android.kotlinVersion=' gradle.properties; then
              sed -i 's/android.kotlinVersion=.*/android.kotlinVersion=1.9.25/' gradle.properties
            else
              echo "android.kotlinVersion=1.9.25" >> gradle.properties
            fi
          else
            echo "android.kotlinVersion=1.9.25" > gradle.properties
          fi
          if ! grep -q 'kotlin.jvm.target.validation.mode' gradle.properties; then
            echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          fi
          if grep -q '^org.gradle.jvmargs' gradle.properties; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g/' gradle.properties
          else
            echo "org.gradle.jvmargs=-Xmx3g" >> gradle.properties
          fi
          if grep -q '^org.gradle.parallel' gradle.properties; then
            sed -i 's/^org.gradle.parallel=.*/org.gradle.parallel=true/' gradle.properties
          else
            echo "org.gradle.parallel=true" >> gradle.properties
          fi
          if grep -q '^org.gradle.caching' gradle.properties; then
            sed -i 's/^org.gradle.caching=.*/org.gradle.caching=true/' gradle.properties
          else
            echo "org.gradle.caching=true" >> gradle.properties
          fi
          echo "=== Patching build.gradle NDK Version ==="
          if [ -f build.gradle ]; then
            sed -i 's/ndkVersion = .*/ndkVersion = "27.3.13750724"/' build.gradle
          fi
          echo "=== Patching app/build.gradle for BuildConfig + namespace (AGP 8.x) ==="
          if [ -f app/build.gradle ]; then
            echo "--- app/build.gradle BEFORE patching ---"
            cat app/build.gradle
            echo "----------------------------------------"
            if grep -q 'buildConfig = false' app/build.gradle; then
              sed -i 's/buildConfig = false/buildConfig = true/g' app/build.gradle
              echo "Replaced buildConfig = false -> true"
            elif grep -q 'buildConfig = true' app/build.gradle; then
              echo "buildConfig = true already set"
            elif grep -q 'buildFeatures {' app/build.gradle; then
              sed -i '/buildFeatures {/a\        buildConfig = true' app/build.gradle
              echo "Added buildConfig = true to existing buildFeatures block"
            else
              sed -i '/android {/a\    buildFeatures {\n        buildConfig = true\n    }' app/build.gradle
              echo "Added buildFeatures block with buildConfig = true"
            fi
            if grep -q 'namespace "com.droidvibe.app"' app/build.gradle; then
              echo "namespace already set correctly to com.droidvibe.app"
            elif grep -q 'namespace "' app/build.gradle; then
              sed -i 's/namespace "[^"]*"/namespace "com.droidvibe.app"/' app/build.gradle
              echo "Fixed namespace to com.droidvibe.app (was wrong value)"
            else
              sed -i '/android {/a\    namespace "com.droidvibe.app"' app/build.gradle
              echo "Added namespace com.droidvibe.app to app/build.gradle"
            fi
            echo "--- app/build.gradle AFTER patching ---"
            cat app/build.gradle
            echo "----------------------------------------"
          else
            echo "ERROR: app/build.gradle not found!"
          fi
          echo "=== Final gradle.properties ==="
          cat gradle.properties
          echo "=== NDK version in build.gradle ==="
          grep ndkVersion build.gradle || echo "ndkVersion not found in build.gradle"
          echo "=== NDK versions installed ==="
          ls ${ANDROID_HOME}/ndk/ 2>/dev/null || echo "No NDK found"
      - name: Build debug APK
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --parallel --build-cache --stacktrace 2>&1 | tee gradle-build.log
      - name: Show errors
        working-directory: apps/mobile/android
        if: always()
        run: |
          grep -E "^e: |error:" gradle-build.log | head -50 || true
          echo "## gradle.properties" >> ${GITHUB_STEP_SUMMARY}
          echo '~~~' >> ${GITHUB_STEP_SUMMARY}
          cat gradle.properties >> ${GITHUB_STEP_SUMMARY} 2>/dev/null || true
          echo '~~~' >> ${GITHUB_STEP_SUMMARY}
          echo "## Gradle Build Log (last 200 lines)" >> ${GITHUB_STEP_SUMMARY}
          echo '~~~' >> ${GITHUB_STEP_SUMMARY}
          tail -200 gradle-build.log >> ${GITHUB_STEP_SUMMARY}
          echo '~~~' >> ${GITHUB_STEP_SUMMARY}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: droidvibe-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-build-log
          path: apps/mobile/android/gradle-build.log
          retention-days: 14
      - name: Report APK build error
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "APK build failed" > /tmp/issue.md
          echo "Commit: ${{ github.sha }}" >> /tmp/issue.md
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> /tmp/issue.md
          echo "" >> /tmp/issue.md
          echo "## Kotlin Compiler Errors" >> /tmp/issue.md
          echo '~~~' >> /tmp/issue.md
          grep -E "^e: " apps/mobile/android/gradle-build.log | head -80 >> /tmp/issue.md 2>/dev/null || echo "No e: lines found" >> /tmp/issue.md
          echo '~~~' >> /tmp/issue.md
          echo "" >> /tmp/issue.md
          echo "## What went wrong" >> /tmp/issue.md
          echo '~~~' >> /tmp/issue.md
          grep -E "What went wrong|FAILURE:|error:" apps/mobile/android/gradle-build.log -A 10 | head -100 >> /tmp/issue.md 2>/dev/null || echo "No error lines found" >> /tmp/issue.md
          echo '~~~' >> /tmp/issue.md
          echo "" >> /tmp/issue.md
          echo "## gradle.properties" >> /tmp/issue.md
          echo '~~~' >> /tmp/issue.md
          cat apps/mobile/android/gradle.properties >> /tmp/issue.md 2>/dev/null || echo "File not found" >> /tmp/issue.md
          echo '~~~' >> /tmp/issue.md
          echo "" >> /tmp/issue.md
          echo "## app/build.gradle (buildConfig + namespace)" >> /tmp/issue.md
          echo '~~~' >> /tmp/issue.md
          grep -n 'buildConfig\|namespace\|buildFeatures' apps/mobile/android/app/build.gradle >> /tmp/issue.md 2>/dev/null || echo "Not found" >> /tmp/issue.md
          echo '~~~' >> /tmp/issue.md
          echo "" >> /tmp/issue.md
          echo "## build.gradle (ndkVersion)" >> /tmp/issue.md
          echo '~~~' >> /tmp/issue.md
          grep -n ndkVersion apps/mobile/android/build.gradle >> /tmp/issue.md 2>/dev/null || echo "Not found" >> /tmp/issue.md
          echo '~~~' >> /tmp/issue.md
          echo "" >> /tmp/issue.md
          echo "## NDK versions installed" >> /tmp/issue.md
          echo '~~~' >> /tmp/issue.md
          ls ${ANDROID_HOME}/ndk/ 2>/dev/null || echo "No NDK found" >> /tmp/issue.md
          echo '~~~' >> /tmp/issue.md
          echo "" >> /tmp/issue.md
          echo "## Gradle Build Log (last 300 lines)" >> /tmp/issue.md
          echo '~~~' >> /tmp/issue.md
          tail -300 apps/mobile/android/gradle-build.log >> /tmp/issue.md 2>/dev/null || echo "No build log found" >> /tmp/issue.md
          echo '~~~' >> /tmp/issue.md
          gh issue create --title "CI: APK build failed" --body-file /tmp/issue.md || true
