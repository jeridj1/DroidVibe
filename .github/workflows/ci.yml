name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  quality:
    name: Typecheck and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  web-build:
    name: Build Web Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Build web
        run: pnpm --filter @droidvibe/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test

  mobile-prebuild:
    name: Expo Prebuild Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Expo prebuild
        working-directory: apps/mobile
        run: |
          pnpm exec expo prebuild --platform android --no-install --clean 2>&1 | tee prebuild.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prebuild-log
          path: apps/mobile/prebuild.log
      - name: Report error
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Prebuild failed" > /tmp/issue.md
          echo "See prebuild-log artifact" >> /tmp/issue.md
          tail -80 apps/mobile/prebuild.log >> /tmp/issue.md
          gh issue create --title "CI: Prebuild failed" --body-file /tmp/issue.md || true

  apk-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [quality, mobile-prebuild]
    env:
      EXPO_NO_TELEMETRY: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configuration-cache=true -Xmx3g"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: pnpm install --no-frozen-lockfile
      - name: SDK licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
      - name: Install SDK components
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'ndk;27.0.12077973' 'cmake;3.22.1' 2>/dev/null || true
      - name: Expo prebuild
        working-directory: apps/mobile
        run: |
          pnpm exec expo prebuild --platform android --no-install --clean 2>&1 | tee prebuild-apk.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prebuild-apk-log
          path: apps/mobile/prebuild-apk.log
      - name: Patch Kotlin version
        working-directory: apps/mobile/android
        if: success()
        run: |
          if [ -f gradle.properties ]; then
            sed -i 's/kotlinVersion=.*/kotlinVersion=1.9.25/' gradle.properties
          else
            echo "kotlinVersion=1.9.25" >> gradle.properties
          fi
          if ! grep -q 'kotlin.jvm.target.validation.mode' gradle.properties; then
            echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          fi
          if ! grep -q 'org.gradle.jvmargs' gradle.properties; then
            echo "org.gradle.jvmargs=-Xmx3g" >> gradle.properties
          fi
          if ! grep -q 'org.gradle.parallel' gradle.properties; then
            echo "org.gradle.parallel=true" >> gradle.properties
          fi
          if ! grep -q 'org.gradle.caching' gradle.properties; then
            echo "org.gradle.caching=true" >> gradle.properties
          fi
      - name: Build debug APK
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --parallel --build-cache --stacktrace 2>&1 | tee gradle-build.log
      - name: Show errors
        working-directory: apps/mobile/android
        if: always()
        run: |
          grep -E "^e: |error:" gradle-build.log | head -50 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: droidvibe-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-build-log
          path: apps/mobile/android/gradle-build.log
          retention-days: 14
      - name: Report APK build error
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "APK build failed" > /tmp/issue.md
          echo "Commit: ${{ github.sha }}" >> /tmp/issue.md
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> /tmp/issue.md
          gh issue create --title "CI: APK build failed" --body-file /tmp/issue.md || true
