name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  quality:
    name: Typecheck and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          pnpm typecheck > /tmp/tsc-output.txt 2>&1
          tsc_exit=$?
          cat /tmp/tsc-output.txt
          if [ $tsc_exit -ne 0 ]; then
            echo "## Full Typecheck Output" >> $GITHUB_STEP_SUMMARY
            echo '~~~' >> $GITHUB_STEP_SUMMARY
            cat /tmp/tsc-output.txt >> $GITHUB_STEP_SUMMARY
            echo '~~~' >> $GITHUB_STEP_SUMMARY
            {
              echo "## Full Typecheck Output"
              echo ""
              echo "Commit: ${{ github.sha }}"
              echo ""
              echo '~~~'
              cat /tmp/tsc-output.txt
              echo '~~~'
            } > /tmp/tc-issue.md
            # gh issue create --title "CI: Typecheck failure (${{ github.sha }})" --body-file /tmp/tc-issue.md || true  # DISABLED: auto-issue creation causes feedback loop
            exit 1
          fi
      - name: Upload typecheck output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-output
          path: /tmp/tsc-output.txt
          if-no-files-found: ignore
      - run: pnpm lint

  web-build:
    name: Build Web Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions
/setup-node@v4
        with:
          node-version: 22


      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @droidvibe/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test

  mobile-prebuild:
    name: Expo Prebuild Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Generate PNG assets from SVG sources
        run: |
          npm install --prefix /tmp/asset-tools sharp
          NODE_PATH=/tmp/asset-tools/node_modules node scripts/generate-assets.js
      - name: Expo prebuild
        working-directory: apps/mobile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          pnpm exec expo prebuild --platform android --no-install --clean > /tmp/prebuild-output.txt 2>&1
          prebuild_exit=$?
          cat /tmp/prebuild-output.txt
          if [ $prebuild_exit -ne 0 ]; then
            {
              echo "## Expo Prebuild Failure"
              echo ""
              echo "Commit: ${{ github.sha }}"
              echo ""
              echo '~~~'
              cat /tmp/prebuild-output.txt
              echo '~~~'
            } > /tmp/pb-issue.md
            # gh issue create --title "CI: Expo prebuild failure (${{ github.sha }})" --body-file /tmp/p
b-issue.md || true  # DISABLED: auto-issue creation causes feedback loop
            exit 1
          fi

  build
-firmware:
    name: Build RP2040 Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake
      - name: Clone Pico SDK
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/raspberrypi/pico-sdk.git /tmp/pico-sdk
      - name: Build firmware projects
        env:
          PICO_SDK_PATH: /tmp/pico-sdk
        run: |
          set -e
          mkdir -p firmware-out
          # Map: project_dir:executable_name:output_name
          build_firmware() {
            local proj="$1"
            local exe="$2"
            local out_name="$3"
            echo "=== Building $proj ($exe) ==="
            mkdir -p "firmware/$proj/build"
            (cd "firmware/$proj/build" && cmake .. -DPICO_SDK_PATH="$PICO_SDK_PATH" && make -j$(nproc) 2>&1)
            # Copy .uf2 to output with correct name
            if [ -f "firmware/$proj/build/${exe}.uf2" ]; then
              cp "firmware/$proj/build/${exe}.uf2" "firmware-out/${out_name}.uf2"
              echo "Built: firmware-out/${out_name}.uf2 ($(wc -c < firmware-out/${out_name}.uf2) bytes)"
            else
              echo "ERROR: ${exe}.uf2 not found in firmware/$proj/build/"
              ls -la "firmware/$proj/build/" || true
              return 1
            fi
          }
          build_firmware logic_analyzer droidvibe_la logic_analyzer_helper
          build_firmware swd droidvibe_swd swd_helper
          build_firmware jtag droidvibe_jtag jtag_helper
          build_firmware avr_isp droidvibe_avr_isp avr_isp_helper
          echo "=== All firmware built ==="
          ls -la firmware-out/
      - name: Upload firmware artifac
ts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-uf2
          path: firmware-ou
t/*.uf2
          if-no-files-found: error
          retention-days: 30

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [mobile-prebuild, build-firmware]
    if: always() && needs.mobile-prebuild.result == 'success'
    env:
      EXPO_NO_TELEMETRY: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Xmx3g"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
          key: gradle-debug-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-debug-${{ runner.os }}-
      - run: pnpm install --no-frozen-lockfile
      - name: Download firmware artifacts
        if: needs.build-firmware.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: firmware-uf2
          path: firmware-out
      - name: Copy firmware to Android assets
        run: |
          mkdir -p apps/mobile/src/main/assets/firmware
          if [ -d firmware-out ]; then
            cp firmware-out/*.uf2 apps/mobile/src/main/assets/firmware/ 2>/dev/null || true
            echo "Firmware assets copied:"
            ls -la apps/mobile/src/main/assets/firmware/ || true
          else
            echo "WARNING: No firmware artifacts available — Prepare Pico will show asset-not-found at runtime"
          fi
      - name: Generate PNG assets from S
VG sources
        run: |
          npm install --prefix /tmp/asset-tools sharp
          NODE_PATH=/tmp/asset-tool
s/node_modules node scripts/generate-assets.js
      - name: Expo prebuild
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Accept SDK licenses & install components
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 2>&1 || true
      - name: Patch build config
        working-directory: apps/mobile/android
        run: |
          if [ -f gradle.properties ]; then
            if grep -q 'android.kotlinVersion=' gradle.properties; then
              sed -i 's/android.kotlinVersion=.*/android.kotlinVersion=1.9.25/' gradle.properties
            else
              echo "android.kotlinVersion=1.9.25" >> gradle.properties
            fi
          else
            echo "android.kotlinVersion=1.9.25" > gradle.properties
          fi
          if ! grep -q 'kotlin.jvm.target.validation.mode' gradle.properties; then
            echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          fi
          if ! grep -q 'org.gradle.jvmargs' gradle.properties; then
            echo "org.gradle.jvmargs=-Xmx3g" >> gradle.properties
          fi
          if ! grep -q 'org.gradle.parallel' gradle.properties; then
            echo "org.gradle.parallel=true" >> gradle.properties
          fi
          if ! grep -q 'org.gradle.caching' gradle.properties; then
            echo "org.gradle.caching=true" >> gradle.properties
          fi
          if [ -f build.gradle ]; then
            sed -i 's/ndkVersion = .*/ndkVersion = "27.3.13750724"/' build.gradle
          fi
          if [ -f app/build.gradle ]; then
            if ! grep -q 'buildConfig = true' app/build.gradle; then
            
  if grep -q 'buildConfig = false' app/build.gradle; then
                sed -i 's/buildConfig = false/buildConfig 
= true/g' app/build.gradle
              elif grep -q 'buildFeatures {' app/build.gradle; then
                sed -i '/buildFeatures {/a\        buildConfig = true' app/build.gradle
              elif grep -q 'android {' app/build.gradle; then
                sed -i '/android {/a\    buildFeatures {\n        buildConfig = true\n    }' app/build.gradle
              fi
            fi
            if ! grep -q 'namespace "com.droidvibe.app"' app/build.gradle; then
              if grep -q 'namespace "' app/build.gradle; then
                sed -i 's/namespace "[^"]*"/namespace "com.droidvibe.app"/' app/build.gradle
              elif grep -q 'android {' app/build.gradle; then
                sed -i '/android {/a\    namespace "com.droidvibe.app"' app/build.gradle
              fi
            fi
          fi
          echo "=== Final gradle.properties ==="
          cat gradle.properties
      - name: Bundle JavaScript
        working-directory: apps/mobile
        run: |
          # Install react-native CLI (not included by default in Expo projects)
          pnpm add -D @react-native-community/cli@latest 2>&1 | tee /tmp/bundle-output.txt
          
          # Create a temporary entry file inside apps/mobile/ (under Metro's projectRoot)
          # so Metro can watch it and compute its SHA-1.
          echo "import 'expo-router/entry';" > index.js
          ENTRY_FILE="$(pwd)/index.js"
          echo "Entry file: $ENTRY_FILE" 2>&1 | tee -a /tmp/bundle-output.txt
          
          # Create assets directory for the JS bundle
          mkdir -p android/app/src/main/assets
          
          # Bundle the JS using Metro (via react-native CLI)
          echo "=== Running react-native bundle ===" 2>&1 | tee -a /tmp/bundle-output.txt
          pnpm exec react-native bundle \
            --platform android \
            --dev false \
            --entry-f
ile "$ENTRY_FILE" \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --asse
ts-dest android/app/src/main/res/ \
            --max-workers 2 \
            --verbose 2>&1 | tee -a /tmp/bundle-output.txt
          bundle_exit=${PIPESTATUS[0]}
          
          # Clean up temporary entry file
          rm -f index.js
          
          if [ $bundle_exit -ne 0 ]; then
            echo "=== react-native bundle failed (exit $bundle_exit) ===" 2>&1 | tee -a /tmp/bundle-output.txt
            exit 1
          fi
          
          echo "=== JS bundle created ===" 2>&1 | tee -a /tmp/bundle-output.txt
          ls -la android/app/src/main/assets/index.android.bundle
      - name: Build debug APK
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --parallel --build-cache --stacktrace 2>&1 | tee /tmp/build-output.txt
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: droidvibe-android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Report build error
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Android APK Build Failure"
            echo ""
            echo "Commit: ${{ github.sha }}"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "### Bundle Output"
            echo '~~~'
            cat /tmp/bundle-output.txt 2>/dev/null || echo "No bundle output captured"
            echo '~~~'
            echo ""
            echo "### Build Output (last 100 lines)"
            echo '~~~'
            tail -100 /tmp/build-output.txt 2>/dev/null || echo "No build output captured"
            echo '~~~'

          } > /tmp/apk-issue.md
          gh issue create --title "CI: Android APK build failure (${{ github.sha }})" 
--body-file /tmp/apk-issue.md || true