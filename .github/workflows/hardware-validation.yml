name: DroidVibe Hardware Validation APK

on:
  push:
    branches:
      - hardware-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Xmx3g"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'cmake;3.22.1'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate standalone Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Verify native USB autolinking
        working-directory: apps/mobile/android
        run: |
          test -f ../../packages/native-usb/android/build.gradle
          grep -R "droidvibe" settings.gradle app/build.gradle || true
      - name: Build standalone debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --parallel --build-cache
      - name: Verify APK contains bundled React Native assets
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|assets/.*/index.android.bundle|assets/.+\.bundle' >/tmp/bundle-assets.txt
          cat /tmp/bundle-assets.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: droidvibe-hardware-validation-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
