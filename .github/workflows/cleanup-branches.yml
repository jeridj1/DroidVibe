              });
              console.log('Deleted branch: playground/rebuild-2026-09-03');
            } catch (e) {
              console.log('Failed to delete playground/rebuild-2026-09-03:', e.message);
            }

      - name: Delete forensic-fix-v10
        uses: actions/github-script@v6
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
