name: Cleanup Redundant Branches

on:
  workflow_dispatch:

jobs:
  delete-branches:
    name: Delete Redundant Branches
    runs-on: ubuntu-latest
    permissions:
      contents: write
      branches: write
    steps:
      - name: Delete v-droidvibe-test
        uses: actions/github-script@v6
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/v-droidvibe-test'
              });
              console.log('Deleted branch: v-droidvibe-test');
            } catch (e) {
              console.log('Failed to delete v-droidvibe-test:', e.message);
            }

      - name: Delete diagnose-usb
        uses: actions/github-script@v6
