name: Diagnose Native USB Linking

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Check autolinking
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pnpm install --no-frozen-lockfile

      - name: Check node_modules for native-usb
        run: |
          echo "=== Checking node_modules ==="
          ls -la apps/mobile/node_modules/@droidvibe/ 2>/dev/null || echo "NOT FOUND in apps/mobile/node_modules/@droidvibe/"
          ls -la node_modules/@droidvibe/ 2>/dev/null || echo "NOT FOUND in node_modules/@droidvibe/"
          echo ""
          echo "=== Check if native-usb symlink exists ==="
          readlink apps/mobile/node_modules/@droidvibe/native-usb 2>/dev/null || echo "No symlink in apps/mobile"
          readlink node_modules/@droidvibe/native-usb 2>/dev/null || echo "No symlink in root"
          echo ""
          echo "=== Check expo-module.config.json ==="
          cat packages/native-usb/expo-module.config.json
          echo ""
          echo "=== Run expo-modules-autolinking search ==="
          cd apps/mobile
          pnpm exec expo-modules-autolinking search --platform android 2>&1 || echo "autolinking search failed"
          echo ""
          echo "=== Run expo prebuild ==="
          pnpm exec expo prebuild --platform android --no-install --clean 2>&1 | tee /tmp/prebuild.log
          echo ""
          echo "=== Check settings.gradle ==="
          cat android/settings.gradle 2>/dev/null || echo "settings.gradle not found"
          echo ""
          echo "=== Check for native-usb in settings.gradle ==="
          grep -i "native-usb\|nativeusb\|native_usb" android/settings.gradle 2>/dev/null || echo "NOT FOUND in settings.gradle"
          echo ""
          echo "=== Check app/build.gradle ==="
          cat android/app/build.gradle 2>/dev/null | head -80 || echo "app/build.gradle not found"
          echo ""
          echo "=== Check for native-usb in app/build.gradle ==="
          grep -i "native-usb\|nativeusb\|native_usb" android/app/build.gradle 2>/dev/null || echo "NOT FOUND in app/build.gradle"
          echo ""
          echo "=== Check android/build.gradle ==="
          cat android/build.gradle 2>/dev/null || echo "build.gradle not found"
          echo ""
          echo "=== List all gradle projects ==="
          grep "include" android/settings.gradle 2>/dev/null || echo "No include statements found"

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: native-usb-diagnostics
          path: |
            /tmp/prebuild.log
            apps/mobile/android/settings.gradle
            apps/mobile/android/app/build.gradle
            apps/mobile/android/build.gradle
