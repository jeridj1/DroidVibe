name: Android Debug APK

on:
  push:
    branches:
      - 'fix/droidvibe-production-usb'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Xmx3g"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android native project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build standalone debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --parallel --build-cache

      - name: Stage APK
        run: |
          mkdir -p artifacts
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk artifacts/app-debug.apk
          ls -lh artifacts/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: droidvibe-standalone-debug-apk
          path: artifacts/app-debug.apk
          retention-days: 30
