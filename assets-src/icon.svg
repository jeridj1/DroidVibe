<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00979D"/>
      <stop offset="1" stop-color="#00565B"/>
    </linearGradient>
    <linearGradient id="wave" x1="100" y1="0" x2="924" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E8E0" stop-opacity="0.3"/>
      <stop offset="0.2" stop-color="#5CFFE8"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="0.8" stop-color="#5CFFE8"/>
      <stop offset="1" stop-color="#00E8E0" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Chip pins - left -->
  <g fill="#0A1518">
    <rect x="246" y="372" width="66" height="14" rx="4"/>
    <rect x="246" y="428" width="66" height="14" rx="4"/>
    <rect x="246" y="484" width="66" height="14" rx="4"/>
    <rect x="246" y="540" width="66" height="14" rx="4"/>
    <rect x="246" y="596" width="66" height="14" rx="4"/>
    <rect x="246" y="652" width="66" height="14" rx="4"/>
    <rect x="712" y="372" width="66" height="14" rx="4"/>
    <rect x="712" y="428" width="66" height="14" rx="4"/>
    <rect x="712" y="484" width="66" height="14" rx="4"/>
    <rect x="712" y="540" width="66" height="14" rx="4"/>
    <rect x="712" y="596" width="66" height="14" rx="4"/>
    <rect x="712" y="652" width="66" height="14" rx="4"/>
  </g>

  <!-- Chip body -->
  <rect x="312" y="312" width="400" height="400" rx="36" fill="#0A1518"/>

  <!-- Chip inner border -->
  <rect x="340" y="340" width="344" height="344" rx="24" fill="none" stroke="#1a3a3e" stroke-width="2"/>

  <!-- Chip orientation dot -->
  <circle cx="512" cy="348" r="10" fill="#00979D" opacity="0.5"/>

  <!-- Waveform glow underlay -->
  <path d="M 100 512 L 400 512 L 420 470 L 440 540 L 460 512 L 475 360 L 500 680 L 525 512 L 545 480 L 565 540 L 585 512 L 924 512"
    stroke="#5CFFE8" stroke-width="38" fill="none"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.2" filter="url(#glow)"/>

  <!-- Waveform main -->
  <path d="M 100 512 L 400 512 L 420 470 L 440 540 L 460 512 L 475 360 L 500 680 L 525 512 L 545 480 L 565 540 L 585 512 L 924 512"
    stroke="url(#wave)" stroke-width="26" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>